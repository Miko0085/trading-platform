name: GoToBots Playable Demo QA
on:
  pull_request:
    paths:
      - 'public/playable-demo/**'
      - 'scripts/test-playable-demo.mjs'
      - 'package.json'
      - '.github/workflows/playable-demo-ci.yml'
  push:
    branches:
      - feature/playable-demo-mvp-v1
  workflow_dispatch:
jobs:
  demo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run playable demo smoke tests
        run: npm run test:demo
      - name: Install dependencies
        run: npm install
      - name: Validate TypeScript and production Vite bundle
        run: npm run build
      - name: Assert demo included in built assets
        run: test -f dist/playable-demo/index.html
