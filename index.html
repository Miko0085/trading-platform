ne;border:0;color:#b6f24a;text-decoration:underline;padding:9px}.foot{text-align:center;margin:18px 0}.risk{border:1px solid #344451;border-radius:14px;padding:15px;font-size:12px;color:#a9b7c5;margin:18px 0}.risk strong{color:white}.back{background:#1c2833;color:white;border:1px solid #344451;border-radius:12px;min-width:44px;min-height:44px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:25px 0}.card{padding:19px;text-align:left;color:white;width:100%;transition:border-color .15s}.card:hover{border-color:#b6f24a}.card h2{font-size:21px;margin:20px 0 8px}.card p{color:#a9b7c5;font-size:13px;min-height:90px}.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:9px;font-size:11px;border-top:1px solid #344451;padding-top:12px}.explore{color:#b6f24a;font-size:13px;font-weight:800;margin-top:18px}.detail{max-width:640px;margin:auto}.bothead{display:flex;align-items:center;gap:16px}.bothead h1{font-size:32px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.pill{font-size:11px;color:#a9b7c5;border:1px solid #344451;border-radius:99px;padding:8px 11px}.panel{padding:17px;margin:17px 0}.chart svg{width:100%;height:150px}.capital{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:15px 0}.capital button{border:1px solid #344451;border-radius:12px;background:#1c2833;color:white;min-height:50px;font-weight:800}.capital button.active{background:#b6f24a;color:#101820;border-color:#b6f24a}.price{display:flex;justify-content:space-between;align-items:center;gap:12px}.price h2{font-size:28px}.overlay{position:fixed;inset:0;background:#000b;display:flex;justify-content:center;align-items:flex-end;z-index:10}.modal{background:#101820;border:1px solid #344451;border-radius:22px 22px 0 0;padding:23px;width:100%;max-width:460px;max-height:94dvh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:start}.summary{background:#1c2833;border:1px solid #344451;border-radius:14px;padding:15px;margin:17px 0}.summary div{display:flex;justify-content:space-between;gap:10px;margin:10px 0;font-size:13px}.summary span{color:#a9b7c5}.modal label{display:block;font-size:13px;font-weight:700;margin:12px 0}.modal input[type=email]{width:100%;padding:14px;background:#1c2833;border:1px solid #344451;color:white;border-radius:12px}.consent{display:flex!important;align-items:start;gap:9px;font-size:12px!important;font-weight:400!important;color:#a9b7c5}.consent input{accent-color:#b6f24a}.error{color:#ffaaaa;font-size:12px}.confirm{text-align:center;max-width:450px;margin:65px auto}.hide{display:none!important}@media(max-width:720px){.cards{grid-template-columns:1fr}.card p{min-height:0}}@media(min-width:650px){.overlay{align-items:center}.modal{border-radius:22px}}@media(max-width:350px){.wrap{padding-left:13px;padding-right:13px}.capital{gap:5px}.capital button{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.profitcalc{margin:20px 0}.profitcalc h2{font-size:21px}.profitcalc .calc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #344451;padding:12px 0;font-size:13px}.calc-row strong{font-variant-numeric:tabular-nums;white-space:nowrap}.calc-range{width:100%;accent-color:#b6f24a;cursor:pointer;touch-action:pan-y}.calc-slider-label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;gap:12px;margin:20px 0 10px}.calc-ends{display:flex;justify-content:space-between;color:#8293a1;font-size:11px;margin:5px 0 13px}.calc-neg{color:#ff8a86!important}.calc-pos{color:#b6f24a}.calc-note{font-size:11px;line-height:1.6;border-left:2px solid #8293a1;color:#a9b7c5;padding-left:11px;margin-top:18px}.analytics-optin{display:flex;align-items:flex-start;gap:9px;color:#a9b7c5;font-size:12px;margin-top:16px}.analytics-optin input{accent-color:#b6f24a}.profitcalc input:focus-visible{outline:3px solid #b6f24a;outline-offset:3px}.calc-row span{color:#a9b7c5}@media(max-width:350px){.calc-row{font-size:11px}}</style><script src="/trading-platform/analytics-config.js"></script><script>
function enableGoToBotsPosthog(){
  if(!window.GOTOBOTS_POSTHOG_KEY||window.__gtPosthogLoaded)return;
  window.__gtPosthogLoaded=true;
  const host=window.GOTOBOTS_POSTHOG_HOST||'https://eu.i.posthog.com';
  const ph=window.posthog=window.posthog||[];
  ph._i=[];
  ph.init=function(key,options,name){
    function stub(target,method){target[method]=function(){target.push([method].concat(Array.prototype.slice.call(arguments)))}}
    const target=name?(ph[name]=[]):ph;
    target.people=target.people||[];
    for(const method of 'capture identify reset get_distinct_id opt_in_capturing opt_out_capturing register'.split(' '))stub(target,method);
    ph._i.push([key,options,name||'posthog']);
  };
  ph.__SV=1;
  ph.init(window.GOTOBOTS_POSTHOG_KEY,{api_host:host,autocapture:false,capture_pageview:false,capture_pageleave:false,disable_session_recording:true,person_profiles:'identified_only',persistence:'localStorage+cookie'});
  const el=document.createElement('script');el.async=true;el.crossOrigin='anonymous';
  el.src=host.replace('.i.posthog.com','-assets.i.posthog.com')+'/static/array.js';
  el.onerror=()=>console.warn('PostHog SDK blocked or unavailable');
  document.head.appendChild(el);
}
</script></head><body><div id="app"></div><script>
const bots=[{id:'eth-grid',name:'ETH GRID',asset:'ETH / USDT',desc:'Automated Ethereum trading strategy designed around defined price ranges.',risk:'Variable',type:'Range-based automation',icon:'▦'},{id:'cold-bot',name:'COLD BOT',asset:'Crypto',desc:'Risk-focused automated trading strategy with predefined operating rules.',risk:'Strategy-dependent',type:'Rules-based automation',icon:'⬡'},{id:'growth-bot',name:'GROWTH BOT',asset:'Crypto',desc:'Dynamic automated strategy designed for higher-risk market exposure.',risk:'Higher',type:'Dynamic automation',icon:'↗'}];
const app=document.getElementById('app'),submissions=new Set();
const SOURCE_KEYS=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','campaign_id','creative_id'];
const KEY_FIRST='gt:first',KEY_LAST='gt:last',KEY_ID='gt:visitor',KEY_SESSION='gt:session',KEY_ANALYTICS='gt:analytics',KEY_SCORE='gt:score';
function storage(type){try{return type==='local'?localStorage:sessionStorage}catch{return null}}
function readJSON(store,key){try{return JSON.parse(store?.getItem(key)||'null')}catch{return null}}
function uuid(){return crypto.randomUUID()}
function storedId(store,key){let value;try{value=store?.getItem(key)}catch{}if(!value){value=uuid();try{store?.setItem(key,value)}catch{}}return value}
const anonymousId=storedId(storage('local'),KEY_ID),sessionId=storedId(storage('session'),KEY_SESSION);
const incoming=Object.fromEntries([...new URLSearchParams(location.search)].filter(([key,value])=>SOURCE_KEYS.includes(key)&&value).map(([key,value])=>[key,value.slice(0,160)]));
const firstTouch=readJSON(storage('local'),KEY_FIRST)||incoming;
const latestTouch=Object.keys(incoming).length?incoming:readJSON(storage('local'),KEY_LAST)||firstTouch;
try{if(!storage('local')?.getItem(KEY_FIRST))storage('local')?.setItem(KEY_FIRST,JSON.stringify(firstTouch));if(Object.keys(incoming).length)storage('local')?.setItem(KEY_LAST,JSON.stringify(latestTouch));}catch{}
let selected=bots[0],capital=250,scenario=0,modal=false,confirmed=false,expanded=false;
let analyticsConsent=storage('local')?.getItem(KEY_ANALYTICS)==='yes';
const scoredEvents=new Set(readJSON(storage('session'),KEY_SCORE)||[]);
const weights={bot_selected:10,strategy_viewed:10,calculator_interacted:15,capital_selected:10,activation_clicked:20,waitlist_joined:35};
const seenViews=new Set();
if(analyticsConsent)enableGoToBotsPosthog();
function log(event,props={},uniqueKey){
 const key=uniqueKey?event+':'+uniqueKey:null;
 if(key&&seenViews.has(key))return;
 if(key)seenViews.add(key);
 if(event in weights&&!scoredEvents.has(event)){scoredEvents.add(event);try{storage('session')?.setItem(KEY_SCORE,JSON.stringify([...scoredEvents]))}catch{}}
 const payload={anonymous_id:anonymousId,session_id:sessionId,timestamp:new Date().toISOString(),...latestTouch,first_touch_source:firstTouch.utm_source,first_touch_campaign:firstTouch.utm_campaign,...props,app:'gotobots',environment:'preview'};
 console.info('[GoToBots analytics]',event,payload);
 if(analyticsConsent&&window.posthog?.capture)window.posthog.capture(event,payload);
}
function setConsent(checked){
 analyticsConsent=checked;
 try{storage('local')?.setItem(KEY_ANALYTICS,checked?'yes':'no')}catch{}
 if(checked){enableGoToBotsPosthog();if(window.posthog?.opt_in_capturing)window.posthog.opt_in_capturing();log('screen_viewed',{screen_name:route()==='/'?'welcome':'bot_details'});if(route()==='/')log('landing_view',{screen_name:'welcome'})}
 else if(window.posthog?.opt_out_capturing)window.posthog.opt_out_capturing();
}
function calcState(){return {screen_name:'bot_details',bot_id:selected.id,bot_name:selected.name,selected_capital:capital,illustrative_monthly_return_percent:scenario,illustrative_monthly_pnl:capital*scenario/100}}
function chooseCapital(v){if(v===capital)return;capital=v;log('calculator_interacted',calcState());log('capital_selected',calcState());render()}
function scenarioInput(v){scenario=Number(v);const el=document.getElementById('scenario-percentage');if(el)el.textContent=(scenario>0?'+':'')+scenario+'%';const pnl=capital*scenario/100;const values=document.getElementById('calc-values');if(values)values.innerHTML=calcValues()}
let lastCommittedScenario=0;
function scenarioCommit(){if(lastCommittedScenario===scenario)return;lastCommittedScenario=scenario;log('calculator_interacted',calcState());log('return_scenario_changed',calcState())}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n)}
function calcValues(){const pnl=capital*scenario/100;return '<div class="calc-row"><span>Starting Capital</span><strong>'+money(capital)+'</strong></div><div class="calc-row"><span>Illustrative Monthly Return</span><strong>'+(scenario>0?'+':'')+scenario+'%</strong></div><div class="calc-row"><span>Illustrative Monthly P&amp;L</span><strong class="'+(pnl<0?'calc-neg':pnl>0?'calc-pos':'')+'">'+(pnl>0?'+':'')+money(pnl)+'</strong></div><div class="calc-row"><span>Illustrative Ending Value</span><strong>'+money(capital+pnl)+'</strong></div>'}
function calculator(){return '<section id="calculator" class="panel profitcalc"><h2>Monthly Profit / Loss Calculator</h2><p class="muted">Explore hypothetical outcomes, including possible losses.</p><b>Trading Capital</b><div class="capital">'+[100,250,500,1000].map(n=>'<button type="button" class="'+(capital===n?'active':'')+'" aria-pressed="'+(capital===n)+'" onclick="chooseCapital('+n+')">$'+n.toLocaleString()+'</button>').join('')+'</div><label for="scenario-slider" class="calc-slider-label"><span>Illustrative Monthly Return</span><strong id="scenario-percentage">'+(scenario>0?'+':'')+scenario+'%</strong></label><input id="scenario-slider" class="calc-range" type="range" min="-100" max="100" step="5" value="'+scenario+'" oninput="scenarioInput(this.value)" onchange="scenarioCommit()" onpointerup="scenarioCommit()" onkeyup="scenarioCommit()" onblur="scenarioCommit()"><div class="calc-ends"><span>−100%</span><span>0%</span><span>+100%</span></div><div id="calc-values">'+calcValues()+'</div><p class="calc-note">Illustrative scenario only. Not a forecast or verified bot performance. Trading involves significant risk of loss. Fees and taxes are excluded.</p></section>'}
function header(back=false,title=''){return '<header class="head">'+(back?'<button class="back" onclick="goBack()" aria-label="Back">←</button>':'<div class="brand" onclick="go(\'/\')"><i>⌘</i>GoTo<span class="lime">Bots</span></div>')+(title?'<b>'+title+'</b>':'')+'<span class="tag">● EARLY PREVIEW</span></header>'}
function risk(full=false){return '<section class="risk"><strong>ⓘ Risk & performance disclosure</strong><p>Automated crypto trading involves significant market risk. Returns are not guaranteed and capital can be lost. No trading or deposits are available in this preview.</p>'+(full?'<p>“Up to 100% Returns per Month” is a product-owner marketing claim pending verification. Measurement period, methodology, fees, historical context and supporting records have not yet been supplied. This figure must not be used to predict returns.</p>':'')+'</section>'}
function button(label,action){return '<button class="primary" onclick="'+action+'">'+label+' →</button>'}
function welcome(){return header()+'<section class="welcome"><span class="offer">✦ 14 DAYS FREE AT LAUNCH</span><h1>Put Your Crypto Trading on <span class="lime">Autopilot.</span></h1><div class="claim"><small>POTENTIAL RETURNS · UNVERIFIED CLAIM</small><h2>Up to 100% Returns per Month.</h2><p class="tiny">Marketing claim pending substantiation. Not a projection or guarantee.</p></div><p class="muted">Automated crypto trading bots. No trading experience required to explore.</p><div class="steps">'+[['⌘','Choose Your Bot','Explore strategies and risk levels.'],['◈','Select Your Capital','Preview a setup starting from $100.'],['⟳','Automate Your Strategy','Designed to operate without manual trading.']].map((x,i)=>'<div class="step"><span class="symbol">'+x[0]+'</span><div><strong>0'+(i+1)+' '+x[1]+'</strong><p>'+x[2]+'</p></div></div>').join('')+'</div>'+button('Explore Trading Bots',"log('welcome_cta_clicked',{screen_name:'welcome',cta_id:'explore_bots'});go('/bots')")+'<p class="tiny foot">Pre-launch preview. No live trading or deposits. Returns are not guaranteed. Crypto trading involves significant risk of loss.</p><button class="link" onclick="expanded=!expanded;render()">View performance & risk disclosures</button>'+(expanded?risk(true):'')+'<label class="analytics-optin"><input type="checkbox" '+(analyticsConsent?'checked':'')+' onchange="setConsent(this.checked)"> Allow anonymous product analytics (optional)</label></section>'}
function lobby(){return header(true)+'<p class="lime tiny">THE STRATEGY LINEUP</p><h1 style="font-size:35px">Explore Trading Bots</h1><p class="muted">Choose a strategy that matches your trading approach.</p><div class="cards">'+bots.map(b=>'<button class="card" onclick="pick(\''+b.id+'\')"><span class="symbol">'+b.icon+'</span><h2>'+b.name+'</h2><p>'+b.desc+'</p><div class="meta"><span>'+b.asset+'</span><span class="pill">Risk: '+b.risk+'</span></div><div class="explore">Explore Bot →</div></button>').join('')+'</div><p class="tiny foot">Strategies are conceptual. No live trading or verified performance is shown.</p>'}
function chart(){const vals=[52,54,51,57,55,60,56,59,62,58,65,61,67,63,65,69,64,68,71,67,73,70,75,72];const pts=vals.map((v,i)=>(12+i*12)+','+(112-(v-45)*2.1)).join(' ');return '<section class="panel chart"><b>Illustrative Market Scenario</b><p class="lime tiny">SIMULATION — NOT ACTUAL PERFORMANCE</p><svg viewBox="0 0 300 130" preserveAspectRatio="none" role="img" aria-label="Synthetic illustrative market scenario"><path d="M0 35H300M0 70H300M0 105H300" stroke="#344451" stroke-dasharray="3 5"/><polyline points="'+pts+'" stroke="#b6f24a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><p class="tiny">Synthetic illustration only. No actual prices, profits, ROI or backtesting.</p></section>'}
function details(){if(confirmed)return header(true,'Preview confirmed')+'<section class="confirm"><div class="lime" style="font-size:65px">✓</div><h1>Demo Request <span class="lime">Recorded Locally</span></h1><p class="muted">This preview recorded your interest in this browser only. The real waitlist is not connected.</p><div class="panel"><b>'+selected.name+'</b><p class="muted">$'+capital.toLocaleString()+' hypothetical capital</p></div>'+button('Back to Bots',"go('/bots')")+'<p class="tiny">No email sent. No trading account created.</p></section>';return header(true,selected.name)+'<div class="detail"><div class="bothead"><span class="symbol" style="width:65px;height:65px">'+selected.icon+'</span><div><span class="lime tiny">AUTOMATED STRATEGY</span><h1>'+selected.name+'</h1><span class="muted">'+selected.asset+'</span></div></div><p class="muted">'+selected.desc+'</p><div class="chips"><span class="pill">Risk: '+selected.risk+'</span><span class="pill">'+selected.type+'</span></div>'+calculator()+'<div class="panel"><div class="price"><div><span class="muted">Planned Subscription</span><h2>$39 <small>/month</small></h2></div><span class="offer">14 DAYS FREE*</span></div><p class="tiny">*14-day SaaS subscription trial planned at launch. Subscription fees and trading capital are separate.</p></div>'+risk()+button('Request Access',"log('activation_clicked',{...calcState(),cta_id:'request_access'});log('waitlist_modal_opened',{...calcState(),screen_name:'early_access'});modal=true;render()")+'<p class="tiny foot">No payment or exchange connection required</p></div>'}
function dialog(){return '<div class="overlay" onclick="if(event.target===this){modal=false;render()}"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><div><span class="lime tiny">PRIVATE PREVIEW</span><h2 id="modal-title">Get Early Access</h2></div><button class="back" onclick="modal=false;render()" aria-label="Close">×</button></div><p class="muted">GoToBots is currently in development. Join the waitlist to be notified when access becomes available.</p><div class="summary"><div><span>Selected bot</span><b>'+selected.name+'</b></div><div><span>Preview capital</span><b>$'+capital.toLocaleString()+'</b></div><div><span>Illustrative monthly return</span><b>'+scenario+'%</b></div><div><span>Planned subscription</span><b>$39/month</b></div><p class="lime tiny">✓ 14-day subscription trial planned at launch</p></div><form onsubmit="submitDemo(event)" novalidate><label for="email">Email address</label><input id="email" onfocus="startForm()" oninput="startForm()" type="email" autocomplete="email" placeholder="you@example.com" required><p id="err" class="error" role="alert"></p><label class="consent"><input id="consent" onfocus="startForm()" type="checkbox"> I agree to receive optional marketing updates. (Not required.)</label><button type="submit" class="primary">Join Waitlist →</button></form><p class="tiny foot">Demo only · Temporary local memory · No email saved or sent</p></section></div>'}
let formStarted=false;
function startForm(){if(formStarted)return;formStarted=true;log('waitlist_form_started',{...calcState(),screen_name:'early_access'})}
function submitDemo(e){
 e.preventDefault();
 const email=document.getElementById('email').value.trim().toLowerCase(),err=document.getElementById('err');
 if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)){err.textContent='Enter a valid email address.';return}
 if(submissions.has(email)){err.textContent='This email was already submitted in this demo session.';return}
 submissions.add(email);
 log('waitlist_form_submitted_demo',{...calcState(),screen_name:'early_access',marketing_consent:document.getElementById('consent').checked});
 modal=false;confirmed=true;render();
 log('confirmation_viewed',{...calcState(),screen_name:'confirmation'},'confirmation:'+selected.id);
}
function route(){const path=location.pathname.replace(/^\/trading-platform\/?/,'/').replace(/\/+$/,'');return path||'/'}
function go(path){history.pushState({},'', '/trading-platform'+(path==='/'?'/':path));modal=false;confirmed=false;render();window.scrollTo(0,0)}
function goBack(){if(modal){modal=false;render();return}go(route().startsWith('/bots/')?'/bots':'/')}
function pick(id){
 selected=bots.find(b=>b.id===id);capital=250;scenario=0;lastCommittedScenario=0;confirmed=false;
 log('bot_selected',{screen_name:'bot_lobby',bot_id:id,bot_name:selected.name});go('/bots/'+id)
}
let lastRoute='',renderedCalculator='';
function render(){
 const r=route();
 if(r!==lastRoute){
  if(r==='/'){log('screen_viewed',{screen_name:'welcome'},'screen:welcome');log('landing_view',{screen_name:'welcome'},'landing')}
  else if(r==='/bots'){log('screen_viewed',{screen_name:'bot_lobby'},'screen:lobby');log('bot_list_viewed',{screen_name:'bot_lobby'},'lobby')}
  else if(r.startsWith('/bots/')){const b=bots.find(x=>x.id===r.split('/')[2]);if(b){selected=b;log('screen_viewed',{screen_name:'bot_details',bot_id:b.id},'screen:'+b.id);log('strategy_viewed',{screen_name:'bot_details',bot_id:b.id,bot_name:b.name},'strategy:'+b.id)}}
  lastRoute=r;
 }
 app.innerHTML='<main class="wrap">'+(r==='/bots'?lobby():r.startsWith('/bots/')?details():welcome())+'</main>'+(modal?dialog():'');
 if(modal){formStarted=false}
 const calc=document.getElementById('calculator');
 if(calc&&!confirmed&&renderedCalculator!==selected.id){
  renderedCalculator=selected.id;
  if('IntersectionObserver' in window){
   const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){log('calculator_viewed',calcState(),'calculator:'+selected.id);observer.disconnect()}},{threshold:.3});
   observer.observe(calc);
  }else log('calculator_viewed',calcState(),'calculator:'+selected.id);
 }
}
window.addEventListener('popstate',()=>{modal=false;confirmed=false;render()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=false;render()}});render();
</script></body></html>
