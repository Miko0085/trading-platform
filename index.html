</script></head><body><div id="app"></div><script>
const bots=[{id:'eth-grid',name:'ETH GRID',asset:'ETH / USDT',desc:'Automated Ethereum trading strategy designed around defined price ranges.',risk:'Variable',type:'Range-based automation',icon:'▦'},{id:'cold-bot',name:'COLD BOT',asset:'Crypto',desc:'Risk-focused automated trading strategy with predefined operating rules.',risk:'Strategy-dependent',type:'Rules-based automation',icon:'⬡'},{id:'growth-bot',name:'GROWTH BOT',asset:'Crypto',desc:'Dynamic automated strategy designed for higher-risk market exposure.',risk:'Higher',type:'Dynamic automation',icon:'↗'}];
const app=document.getElementById('app'),session=crypto.randomUUID(),submissions=new Set(),utm=Object.fromEntries(new URLSearchParams(location.search).entries().filter(([k])=>k.startsWith('utm_')));let selected=bots[0],capital=250,modal=false,confirmed=false,expanded=false;
function log(event,props={}){console.info('[GoToBots preview]',{event,timestamp:new Date().toISOString(),sessionId:session,...utm,...props});if(window.posthog&&window.GOTOBOTS_POSTHOG_KEY)window.posthog.capture(event,{...utm,...props,app:'gotobots',environment:'preview'})}
function header(back=false,title=''){return '<header class="head">'+(back?'<button class="back" onclick="goBack()" aria-label="Back">←</button>':'<div class="brand" onclick="go(\'/\')"><i>⌘</i>GoTo<span class="lime">Bots</span></div>')+(title?'<b>'+title+'</b>':'')+'<span class="tag">● EARLY PREVIEW</span></header>'}
function risk(full=false){return '<section class="risk"><strong>ⓘ Risk & performance disclosure</strong><p>Automated crypto trading involves significant market risk. Returns are not guaranteed and capital can be lost. No trading or deposits are available in this preview.</p>'+(full?'<p>“Up to 100% Returns per Month” is a product-owner marketing claim pending verification. Measurement period, methodology, fees, historical context and supporting records have not yet been supplied. This figure must not be used to predict returns.</p>':'')+'</section>'}
function button(label,action){return '<button class="primary" onclick="'+action+'">'+label+' →</button>'}
function welcome(){return header()+'<section class="welcome"><span class="offer">✦ 14 DAYS FREE AT LAUNCH</span><h1>Put Your Crypto Trading on <span class="lime">Autopilot.</span></h1><div class="claim"><small>POTENTIAL RETURNS · UNVERIFIED CLAIM</small><h2>Up to 100% Returns per Month.</h2><p class="tiny">Marketing claim pending substantiation. Not a projection or guarantee.</p></div><p class="muted">Automated crypto trading bots. No trading experience required to explore.</p><div class="steps">'+[['⌘','Choose Your Bot','Explore strategies and risk levels.'],['◈','Select Your Capital','Preview a setup starting from $100.'],['⟳','Automate Your Strategy','Designed to operate without manual trading.']].map((x,i)=>'<div class="step"><span class="symbol">'+x[0]+'</span><div><strong>0'+(i+1)+' '+x[1]+'</strong><p>'+x[2]+'</p></div></div>').join('')+'</div>'+button('Explore Trading Bots',"log('cta_clicked',{screen:'welcome',ctaId:'explore_bots'});go('/bots')")+'<p class="tiny foot">Pre-launch preview. No live trading or deposits. Returns are not guaranteed. Crypto trading involves significant risk of loss.</p><button class="link" onclick="expanded=!expanded;render()">View performance & risk disclosures</button>'+(expanded?risk(true):'')+'</section>'}
function lobby(){return header(true)+'<p class="lime tiny">THE STRATEGY LINEUP</p><h1 style="font-size:35px">Explore Trading Bots</h1><p class="muted">Choose a strategy that matches your trading approach.</p><div class="cards">'+bots.map(b=>'<button class="card" onclick="pick(\''+b.id+'\')"><span class="symbol">'+b.icon+'</span><h2>'+b.name+'</h2><p>'+b.desc+'</p><div class="meta"><span>'+b.asset+'</span><span class="pill">Risk: '+b.risk+'</span></div><div class="explore">Explore Bot →</div></button>').join('')+'</div><p class="tiny foot">Strategies are conceptual. No live trading or verified performance is shown.</p>'}
function chart(){const vals=[52,54,51,57,55,60,56,59,62,58,65,61,67,63,65,69,64,68,71,67,73,70,75,72];const pts=vals.map((v,i)=>(12+i*12)+','+(112-(v-45)*2.1)).join(' ');return '<section class="panel chart"><b>Illustrative Market Scenario</b><p class="lime tiny">SIMULATION — NOT ACTUAL PERFORMANCE</p><svg viewBox="0 0 300 130" preserveAspectRatio="none" role="img" aria-label="Synthetic illustrative market scenario"><path d="M0 35H300M0 70H300M0 105H300" stroke="#344451" stroke-dasharray="3 5"/><polyline points="'+pts+'" stroke="#b6f24a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><p class="tiny">Synthetic illustration only. No actual prices, profits, ROI or backtesting.</p></section>'}
function details(){if(confirmed)return header(true,'Preview confirmed')+'<section class="confirm"><div class="lime" style="font-size:65px">✓</div><h1>You’re on the <span class="lime">Preview List</span></h1><p class="muted">This prototype has recorded your interest locally. The live waitlist is not connected yet.</p><div class="panel"><b>'+selected.name+'</b><p class="muted">$'+capital.toLocaleString()+' hypothetical capital</p></div>'+button('Back to Bots',"go('/bots')")+'<p class="tiny">No email sent. No trading account created.</p></section>';return header(true,selected.name)+'<div class="detail"><div class="bothead"><span class="symbol" style="width:65px;height:65px">'+selected.icon+'</span><div><span class="lime tiny">AUTOMATED STRATEGY</span><h1>'+selected.name+'</h1><span class="muted">'+selected.asset+'</span></div></div><p class="muted">'+selected.desc+'</p><div class="chips"><span class="pill">Risk: '+selected.risk+'</span><span class="pill">'+selected.type+'</span></div>'+chart()+'<h2>Select Your Trading Capital</h2><p class="muted">Choose a hypothetical amount to preview your setup.</p><div class="capital">'+[100,250,500,1000].map(n=>'<button class="'+(capital===n?'active':'')+'" aria-pressed="'+(capital===n)+'" onclick="capital='+n+';log(\'capital_selected\',{screen:\'details\',botId:selected.id,capital});render()">$'+n.toLocaleString()+'</button>').join('')+'</div><p class="tiny">Your selection is for preview purposes only. No funds will be deposited or connected.</p><div class="panel"><div class="price"><div><span class="muted">Planned Subscription</span><h2>$39 <small>/month</small></h2></div><span class="offer">14 DAYS FREE*</span></div><p class="tiny">*14-day SaaS subscription trial planned at launch. Subscription fees and trading capital are separate.</p></div>'+risk()+button('Request Access',"log('activation_clicked',{screen:'details',botId:selected.id,capital,ctaId:'request_access'});modal=true;render()")+'<p class="tiny foot">No payment or exchange connection required</p></div>'}
function dialog(){return '<div class="overlay" onclick="if(event.target===this){modal=false;render()}"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><div><span class="lime tiny">PRIVATE PREVIEW</span><h2 id="modal-title">Get Early Access</h2></div><button class="back" onclick="modal=false;render()" aria-label="Close">×</button></div><p class="muted">GoToBots is currently in development. Join the waitlist to be notified when access becomes available.</p><div class="summary"><div><span>Selected bot</span><b>'+selected.name+'</b></div><div><span>Preview capital</span><b>$'+capital.toLocaleString()+'</b></div><div><span>Planned subscription</span><b>$39/month</b></div><p class="lime tiny">✓ 14-day subscription trial planned at launch</p></div><form onsubmit="submitDemo(event)" novalidate><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><p id="err" class="error" role="alert"></p><label class="consent"><input id="consent" type="checkbox"> I agree to receive optional marketing updates. (Not required.)</label><button type="submit" class="primary">Join Waitlist →</button></form><p class="tiny foot">Demo only · Temporary local memory · No email sent</p></section></div>'}
function submitDemo(e){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),err=document.getElementById('err');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Enter a valid email address.';return}if(submissions.has(email)){err.textContent='This email was already submitted in this demo session.';return}submissions.add(email);log('waitlist_form_submitted_demo',{screen:'early_access',botId:selected.id,capital,marketingConsent:document.getElementById('consent').checked});modal=false;confirmed=true;render()}
function route(){return location.pathname.replace(/^\/trading-platform\/?/,'/')}
function go(path){history.pushState({},'', '/trading-platform'+(path==='/'?'/':path));modal=false;confirmed=false;render();window.scrollTo(0,0)}
function goBack(){if(modal){modal=false;render();return}go(route().startsWith('/bots/')?'/bots':'/')}
function pick(id){selected=bots.find(b=>b.id===id);capital=250;log('bot_selected',{screen:'lobby',botId:id});go('/bots/'+id)}
let lastRoute='';function render(){const r=route();if(r!==lastRoute){if(r==='/')log('landing_view',{screen:'welcome'});else if(r==='/bots')log('bot_list_viewed',{screen:'lobby'});else if(r.startsWith('/bots/')){const b=bots.find(x=>x.id===r.split('/')[2]);if(b){selected=b;log('strategy_viewed',{screen:'details',botId:b.id});log('simulation_viewed',{screen:'details',botId:b.id})}}lastRoute=r}app.innerHTML='<main class="wrap">'+(r==='/bots'?lobby():r.startsWith('/bots/')?details():welcome())+'</main>'+(modal?dialog():'');if(modal)document.getElementById('email').focus()}
window.addEventListener('popstate',()=>{modal=false;confirmed=false;render()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=false;render()}});render();
</script></body></html>
