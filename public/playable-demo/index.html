function route(action){if(!action)return;var p=action.split(':'),type=p[0],arg=p.slice(1).join(':');if(type==='go'){go(arg);return}if(type==='modal'){openModal(arg);return}if(type==='toastclose'){s.toast='';render();return}if(type==='close'||type==='dismiss'){closeModal();return}if(type==='register'){openModal('register');return}if(type==='continue'){s.registered=true;openModal('welcome');return}if(type==='explore'){s.registered=true;openModal('welcome');return}if(type==='verify'){s.verified=true;awardTask('verify');openModal('welcome');return}if(type==='startdemo'){closeModal();go('bot');setDemoStart();return}if(type==='start'){if(s.mode==='demo')setDemoStart();else if(!s.bybit||!s.ready){s.wizard=0;openModal('wizard')}else if(s.credits<=0)openModal('subscription');else startCycle('live');return}if(type==='mode'){if(arg==='live'&&!s.bybit){s.wizard=0;openModal('wizard');return}s.mode=arg;save();render();return}if(type==='metric'){s.chartMetric=arg;save();render();return}if(type==='range'){s.chartRange=arg;s.chartPoint=5;save();render();return}if(type==='view'){s.view=arg;render();scrollTo(0,0);return}if(type==='taskfilter'){s.taskFilter=arg;render();return}if(type==='cyclefilter'){s.cycleFilter=arg;render();return}if(type==='sub'){s.subtab=arg;render();return}if(type==='task'){openModal('task:'+arg);return}if(type==='do'){closeModal();doneTask(arg);render();return}if(type==='complete'){awardTask(arg);closeModal();render();return}if(type==='pause'){if(arg==='demo'){s.demoPaused=true;s.demoActive=false;notify('Demo paused · no new simulated orders')}else{s.pendingPause=!s.pendingPause;notify(s.pendingPause?'Pause requested after current Live cycle':'Scheduled pause cancelled')}save();render();return}if(type==='resume'){if(arg==='demo'){s.demoPaused=false;s.demoActive=true;notify('Demo resumed')}else if(s.credits>0){s.paused=false;s.pendingPause=false;notify('Live access resumed')}save();render();return}if(type==='next'){nextEvent(s.mode,arg==='loss');render();return}if(type==='finish'){if(s.mode==='demo')s.demoPaused=false;while(activeCycle(s.mode)&&activeCycle(s.mode).step<4)nextEvent(s.mode);render();return}if(type==='inspect'){openModal('inspect:'+arg);return}if(type==='spend'){spend(Number(arg));render();return}if(type==='wizard'){s.wizard=Number(arg);openModal('wizard');return}if(type==='wizardback'){s.wizard=Math.max(0,s.wizard-1);render();return}if(type==='wizardnext'){if(s.wizard===2){s.bybit=true;awardTask('bybit')}if(s.wizard===3){s.setup=true;awardTask('setup')}if(s.wizard===4){s.ready=true;awardTask('ready')}if(s.wizard===5){if(!s.ready||s.credits<=0){notify('Complete readiness and obtain Credits first');return}s.mode='live';s.liveActive=true;awardTask('live');closeModal();go('bot');startCycle('live');return}s.wizard=Math.min(5,s.wizard+1);render();return}if(type==='subscribe'){if(s.subscription){notify('Mock subscription already active');return}s.subscription=true;addTx('subscription',300,'Mock subscription · $39 / 300 Credits');save();closeModal();notify('✓ Mock subscription active · +300 Credits');return}if(type==='ref'){nextRef(arg);openModal('friend:'+arg);return}if(type==='friendlevel'){s.friendLevel=Number(arg);render();return}if(type==='friend'){openModal('friend:'+arg);return}if(type==='addfriend'){openModal('addfriend');return}if(type==='copy'||type==='share'){var link=location.origin+location.pathname+'?ref='+encodeURIComponent(s.username.toLowerCase().replace(/\W/g,''));if(type==='share'&&navigator.share){navigator.share({title:'GoToBots Demo',url:link}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(link).then(function(){notify('Referral link copied')}).catch(function(){notify('Copy not available in this browser')})}else notify('Copy is unavailable in this browser');return}if(type==='language'){s.language=arg;save();notify('Preferred language saved · English prototype copy');return}if(type==='toggle'){s[arg]=!s[arg];save();notify('Setting updated');return}if(type==='disco
